/* ---------------------------------------------------------------
   /typography — type pairings in use.

   Uses the portfolio's own design system: the 540px page-shell, the
   14px base, hairline rules instead of card boxes, JetBrains Mono
   micro-labels, dashed-underline links, cobalt accent. Tokens are
   redeclared here (not imported from app.css) so this page ships
   ~7KB of CSS instead of 90KB it would never use.

   Built as a reference tool, not a brochure: no explanatory prose,
   no result counts, no duplicate affordances. The specimen is the
   interface.
--------------------------------------------------------------- */

:root {
  --body-bg: #fff;
  --grey1: #111;
  --grey2: #555;
  --grey3: #6e6e6e;
  --wash2: #f2f2f2;
  --border-rule: #e5e5e5;
  --accent: #3b5bff;
  --focus-color: rgba(0, 0, 0, 0.5);
  --ui: "Hanken Grotesk", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --display: "Bricolage Grotesque", var(--ui);
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
  color-scheme: light;
}

[data-theme="dark"] {
  --body-bg: #0e0e12;
  --grey1: #eaeaea;
  --grey2: #94949d;
  --grey3: #787880;
  --wash2: #1c1c22;
  --border-rule: #2a2a32;
  --accent: #6b8aff;
  --focus-color: rgba(255, 255, 255, 0.5);
  color-scheme: dark;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --body-bg: #0e0e12;
    --grey1: #eaeaea;
    --grey2: #94949d;
    --grey3: #787880;
    --wash2: #1c1c22;
    --border-rule: #2a2a32;
    --accent: #6b8aff;
    --focus-color: rgba(255, 255, 255, 0.5);
    color-scheme: dark;
  }
}

*, *::before, *::after { box-sizing: border-box; }

html {
  font-size: 14px; /* the portfolio's base */
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  background: var(--body-bg);
  color: var(--grey1);
  font-family: var(--ui);
  font-size: 14px;
  line-height: 1.5;
  letter-spacing: -0.00563rem;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-variant-numeric: tabular-nums;
}

/* the portfolio's shell, verbatim */
.page-shell {
  max-width: 540px;
  margin: 0 auto;
  padding: 80px 16px;
}

a { color: inherit; text-decoration: none; }

:focus-visible {
  outline: 2px solid var(--focus-color);
  outline-offset: 3px;
  border-radius: 3px;
}

/* labels the screen reader needs and the eye does not */
.vh {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.skip-link {
  position: absolute; left: 8px; top: 8px; z-index: 100;
  padding: 8px 12px; border-radius: 6px;
  background: var(--grey1); color: var(--body-bg);
  font-size: 13px; line-height: 1;
  transform: translateY(-56px);
  transition: transform 0.15s ease-out;
}
.skip-link:focus { transform: translateY(0); }

/* ---------- header ---------- */
.back {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 13px; color: var(--grey3);
  transition: color 0.18s ease;
}
.back:hover { color: var(--accent); }

h1 {
  margin: 26px 0 0;
  font-family: var(--display);
  font-weight: 600;
  font-size: 24px;
  line-height: 1.1;
  letter-spacing: -0.03em;
}
.lede {
  margin: 8px 0 0;
  color: var(--grey3);
  font-size: 13px;
}

/* ---------- controls: one line, no chrome ---------- */
.controls { margin-top: 30px; }

.control-row {
  display: flex;
  align-items: center;
  gap: 14px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border-rule);
}

#specimen-text {
  flex: 1 1 auto;
  min-width: 0;
  padding: 0;
  border: none;
  background: none;
  color: var(--grey1);
  font-family: inherit;
  font-size: 15px;
  letter-spacing: inherit;
}
#specimen-text:focus { outline: none; }
#specimen-text::placeholder { color: var(--grey3); }

/* scale: a hairline track that only colours in on interaction */
#size {
  flex: 0 0 104px;
  height: 14px;
  margin: 0;
  accent-color: var(--grey3);
  cursor: ew-resize;
  opacity: 0.55;
  transition: opacity 0.18s ease, accent-color 0.18s ease;
}
.control-row:hover #size,
#size:focus-visible { opacity: 1; accent-color: var(--accent); }

.size-val {
  flex: 0 0 auto;
  min-width: 22px;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--grey3);
  text-align: right;
}

.filters { display: flex; gap: 14px; margin-top: 14px; }
.pill {
  padding: 0 0 2px;
  border: none;
  border-bottom: 1px solid transparent;
  background: none;
  color: var(--grey3);
  font-family: inherit;
  font-size: 13px;
  letter-spacing: inherit;
  cursor: pointer;
  transition: color 0.18s ease, border-color 0.18s ease;
}
.pill:hover { color: var(--grey1); }
.pill[aria-pressed="true"] { color: var(--grey1); border-bottom-color: var(--grey1); }

/* ---------- the list ---------- */
.list {
  margin: 0; padding: 0; list-style: none;
  /* rendered by JS: reserve height so the footer never jumps (CLS) */
  min-height: 100vh;
}

.row {
  padding: 30px 0;
  border-top: 1px solid var(--border-rule);
}
.row:first-child { border-top: none; padding-top: 24px; }

/* the specimen — the point of the page */
.specimen { min-height: calc(var(--size, 56px) * 1.3 + 36px); }
.row:not([data-status="free"]) .specimen { min-height: 0; }

.spec-head {
  margin: 0;
  font-size: var(--size, 56px);
  line-height: 1.08;
  letter-spacing: -0.02em;
  word-break: break-word;
}
.spec-body {
  margin: 14px 0 0;
  font-size: 14px;
  line-height: 1.55;
  color: var(--grey2);
  letter-spacing: 0;
}

/* Licensed and bespoke faces can't be re-served, so those rows show the site
   itself. The ratio is fixed, so lazy-loading one never shifts the page. */
.shot {
  display: block;
  width: 100%;
  max-width: 340px;   /* a screenshot is context, not the specimen — at full
                         column width it outweighed the live-type rows */
  height: auto;
  aspect-ratio: 8 / 5;
  border-radius: 4px;
  background: var(--wash2);
  object-fit: cover;
}

/* the two names, and that they are a pair */
.pairing {
  margin: 16px 0 0;
  font-size: 14px;
  color: var(--grey1);
}
.pairing a {
  color: var(--grey1);
  border-bottom: 1px dashed var(--border-rule);
  transition: color 0.18s ease, border-color 0.18s ease;
}
.pairing a:hover { color: var(--accent); border-bottom-color: var(--accent); }
.plus { margin: 0 8px; color: var(--grey3); }

/* the site it came from */
.row-site {
  display: inline-block;
  margin-top: 7px;
  font-size: 13px;
  color: var(--grey3);
  transition: color 0.18s ease;
}
.row-site:hover { color: var(--accent); }
.arr {
  display: inline-block;
  margin-left: 3px;
  font-size: 11px;
  transition: transform 0.18s cubic-bezier(0.25, 1, 0.5, 1);
}
.row-site:hover .arr { transform: translate(1px, -1px); }

.empty { padding: 60px 0; color: var(--grey3); }

/* ---------- footer ---------- */
.site-foot {
  margin-top: 40px;
  padding-top: 20px;
  border-top: 1px solid var(--border-rule);
  color: var(--grey3);
  font-size: 12.5px;
}
.site-foot p { margin: 0; }
.site-foot a { color: var(--grey2); border-bottom: 1px dashed var(--border-rule); }
.site-foot a:hover { color: var(--accent); border-bottom-color: var(--accent); }

@media (prefers-reduced-motion: reduce) {
  * { transition-duration: 0.01ms !important; }
}
